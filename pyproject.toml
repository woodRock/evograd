[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "evograd"
version = "0.1.0"
description = "GPU-accelerated evolutionary computation + functional deep learning — one library, two paradigms."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "woodRock", email = "j.r.h.wood98@gmail.com" }]
keywords = [
    "evolutionary computation", "genetic algorithm", "PSO", "deep learning",
    "GPU", "MPS", "CUDA", "PyTorch", "neuroevolution", "NAS",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Scientific/Engineering :: Mathematics",
]
dependencies = ["torch>=2.0", "numpy"]

[project.optional-dependencies]
cuda      = ["torch>=2.0"]          # CUDA kernels require nvcc at build time
benchmark = ["deap"]
dev       = ["pytest", "pytest-cov", "black", "ruff"]
all       = ["deap", "pytest", "pytest-cov", "black", "ruff"]

[project.urls]
Homepage   = "https://github.com/woodRock/evograd"
Repository = "https://github.com/woodRock/evograd"
Issues     = "https://github.com/woodRock/evograd/issues"

# The project root IS the evograd package (it contains __init__.py).
# We list all packages explicitly and map "evograd" → "." so that pip sees
# evograd/__init__.py as ./__init__.py, evograd/core as ./core, etc.
[tool.setuptools]
packages = [
    "evograd",
    "evograd.compiler",
    "evograd.core",
    "evograd.cuda",
    "evograd.dsl",
    "evograd.evo",
    "evograd.ml",
    "evograd.mps",
    "evograd.nn",
    "evograd.nn.models",
]

[tool.setuptools.package-dir]
"evograd" = "."

[tool.black]
line-length = 100
target-version = ["py310", "py311", "py312"]

[tool.ruff]
line-length = 100
select = ["E", "F", "W"]
